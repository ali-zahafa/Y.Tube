name: Publish Y.Tube 2.5.2 Playback Recovery Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preview-apk.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-debug-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v2.5.2-playback-recovery-preview
    steps:
      - name: Wait for Android CI build of this exact commit
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "$GH_REPO" --workflow android-ci.yml --commit "$GITHUB_SHA" --json databaseId,conclusion,status --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
            failed="$(gh run list --repo "$GH_REPO" --workflow android-ci.yml --commit "$GITHUB_SHA" --json databaseId,conclusion,status --jq '[.[] | select(.conclusion == "failure")][0].databaseId // empty')"
            if [[ -n "$failed" ]]; then
              echo "Android CI failed for commit $GITHUB_SHA (run $failed); refusing to publish." >&2
              exit 1
            fi
            sleep 15
          done
          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for Android CI success for $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Download APK built from this commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${{ steps.ci.outputs.run_id }}" --repo "$GH_REPO" --name YTXTube-debug-apk --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/Y.Tube-v2.5.2-playback-recovery-preview.apk
          sha256sum dist/Y.Tube-v2.5.2-playback-recovery-preview.apk

      - name: Create or update direct-download GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Y.Tube-v2.5.2-playback-recovery-preview.apk --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" dist/Y.Tube-v2.5.2-playback-recovery-preview.apk \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Y.Tube 2.5.2 - Playback Recovery Preview" \
              --notes "Built from commit $GITHUB_SHA after Android CI unit tests and debug APK build passed. This is a debug/preview APK signed with the Android debug key and uses package com.tensei.ytxtube.preview, so it installs separately from the regular app. This build contains the playback-recovery state/fallback changes. Made-for-Kids playback still requires real-device verification; a successful build does not prove every YouTube stream can play." \
              --prerelease \
              --latest=false
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,assets
