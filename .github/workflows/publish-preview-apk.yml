name: Publish Y.Tube 2.5.1 Debug APK to Releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preview-apk.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-debug-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v2.5.1-dual-sub-debug
      VERIFIED_RUN: '43934532683'
      VERIFIED_SHA: a6270c5a20afbe49c1d655445cff64c1bf09262c
    steps:
      - name: Download APK from successful Android CI run
        shell: bash
        run: |
          set -euo pipefail
          run_status="$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" --jq '.conclusion')"
          run_sha="$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" --jq '.head_sha')"
          if [[ "$run_status" != "success" || "$run_sha" != "$VERIFIED_SHA" ]]; then
            echo "Refusing to release unverified APK: status=$run_status sha=$run_sha" >&2
            exit 1
          fi
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" --name YTXTube-debug-apk --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/Y.Tube-v2.5.1-dual-sub-debug.apk
          sha256sum dist/Y.Tube-v2.5.1-dual-sub-debug.apk

      - name: Create or update direct-download GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Y.Tube-v2.5.1-dual-sub-debug.apk --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" dist/Y.Tube-v2.5.1-dual-sub-debug.apk \
              --repo "$GH_REPO" \
              --target "$VERIFIED_SHA" \
              --title "Y.Tube 2.5.1 - Dual Subtitles + Web Player (Debug)" \
              --notes "Verified Android CI run #43934532683: unit tests and debug APK build passed. Includes optional YouTube WebView playback and unofficial Google Translate web subtitles. This is a **debug/preview APK**, package com.tensei.ytxtube.preview, signed with the Android debug key; it installs separately from the normal signed app. Playback and translation on physical devices are not yet verified; unofficial Google endpoints can throttle or stop responding." \
              --prerelease \
              --latest=false
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,assets
