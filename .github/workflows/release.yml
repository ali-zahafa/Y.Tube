name: Android release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this verified tag and APK to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag when publishing
        if: inputs.publish
        run: test "$GITHUB_REF_TYPE" = tag
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build and verify signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${KEYSTORE_PASSWORD:?Missing keystore password secret}"
          : "${KEY_ALIAS:?Missing key alias secret}"
          : "${KEY_PASSWORD:?Missing key password secret}"
          : "${EXPECTED_CERT:?Missing SHA-256 from the previous release}"
          umask 077
          export ANDROID_RELEASE_KEYSTORE="$(mktemp "$RUNNER_TEMP/y-tube-release.XXXXXX")"
          trap 'rm -f "$ANDROID_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew --no-daemon :app:assembleRelease
          unset KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/zipalign" -c -P 16 4 "$apk"
          certificates="$("$tools/apksigner" verify --verbose --print-certs "$apk")"
          actual="$(sed -nE 's/^(Signer #1|V[0-9.]+ Signer):? certificate SHA-256 digest: ([0-9a-f]{64})$/\2/p' <<< "$certificates" | sort -u)"
          expected="$(tr -d '[:space:]:' <<< "$EXPECTED_CERT" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[a-f0-9]{64}$ && "$actual" == "$expected" ]]
          grep -qx 'Number of signers: 1' <<< "$certificates"
          manifest="$("$tools/aapt" dump badging "$apk")"
          if grep -q '^application-debuggable' <<< "$manifest"; then exit 1; fi
          badging="$(sed -n '1p' <<< "$manifest")"
          version="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$badging")"
          [[ "$badging" == "package: name='com.tensei.ytxtube'"* ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$code" -gt 240 ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then [[ "$GITHUB_REF_NAME" == "v$version" ]]; fi
          mkdir -p release
          cp "$apk" "release/Y.Tube-v$version.apk"
          printf '%s\n' "$badging" "$certificates" > release/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Y.Tube-release
          path: release/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Y.Tube-release
          path: release
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="Y.Tube-$GITHUB_REF_NAME.apk"
          notes="docs/releases/$GITHUB_REF_NAME.md"
          release_notes=(--generate-notes)
          if [[ -f "$notes" ]]; then release_notes=(--notes-file "$notes"); fi
          gh release create "$GITHUB_REF_NAME" "release/$apk" \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Y.Tube $GITHUB_REF_NAME" "${release_notes[@]}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$apk" --dir downloaded
          cmp "release/$apk" "downloaded/$apk"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
