name: Build & Release
on:
  push:
    tags: [ 'v*', 'V*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest --tests "com.tensei.ytxtube.InnerTubeParseTest" --tests "com.tensei.ytxtube.BackgroundPlaybackPolicyTest" --stacktrace
      - run: ./gradlew :app:assembleRelease --stacktrace
      - run: |
          cp app/build/outputs/apk/release/app-release.apk Y.Tube.apk
          cp app/build/outputs/apk/release/app-release.apk YTXTube.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Y.Tube-Release-APK
          path: Y.Tube.apk
      - id: release_title
        run: |
          TAG_NAME="${GITHUB_REF_NAME#v}"
          TAG_NAME="${TAG_NAME#V}"
          [ -z "$TAG_NAME" ] && TAG_NAME="2.4.0"
          echo "title=Y.Tube v${TAG_NAME}" >> $GITHUB_OUTPUT
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_title.outputs.title }}
          files: |
            Y.Tube.apk
            YTXTube.apk
          body: |
            • Fixed 40–60s stream cutoff ("YouTube refused the stream") by matching client User-Agent.
            • Added Previous, Next, Rewind 10s, and Forward 10s controls to the Android media notification.
            • Unified visible branding across Music and headers to Y.Tube.
            • Fixed channel videos and live streams freshness & Arabic upload date parsing.
            • Added Previous & Next navigation controls to both the main video player and Shorts player.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
