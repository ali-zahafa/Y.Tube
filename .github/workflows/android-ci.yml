name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, 'claude/**', 'release/**' ]
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_tiktokPreview: ${{ github.head_ref == 'feature/tiktok-guest' && 'true' || 'false' }}

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Verify fallback classification and diagnostics
        run: ./gradlew :app:testDebugUnitTest --tests com.tensei.freetube.PlayerFallbackTest --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        id: assemble_debug
        if: ${{ !cancelled() }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: ${{ !cancelled() && steps.assemble_debug.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: freetube-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  web-background-device-test:
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Select the runner's upstream IPv4 DNS resolver
        id: resolver
        run: |
          config=/run/systemd/resolve/resolv.conf
          [ -r "$config" ] || config=/etc/resolv.conf
          dns=$(awk '$1 == "nameserver" && $2 ~ /^[0-9.]+$/ && $2 !~ /^127\./ { print $2; exit }' "$config")
          if [ -n "$dns" ]; then echo "option=-dns-server $dns" >> "$GITHUB_OUTPUT"; fi
          getent ahostsv4 www.youtube.com || echo "Runner DNS lookup failed"

      - name: Test real WebView media with screen off beyond 60 seconds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ steps.resolver.outputs.option }}
          disable-animations: true
          script: |
            adb shell ping -c 1 -W 2 www.youtube.com 2>&1 | tee /tmp/yt-emulator-network.log
            if grep -qi 'unknown host' /tmp/yt-emulator-network.log; then adb shell svc data enable && adb shell svc wifi disable && sleep 5; fi
            adb shell ping -c 1 -W 2 www.youtube.com || true
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-background-device-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
