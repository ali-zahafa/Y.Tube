name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The APK is built even when unit tests fail, so a known legacy test failure
      # (InnerTubeParseTest.sharpenYtcChannelAvatar, failing since the initial commit)
      # does not block testing on a device. The "Unit tests" step above still fails
      # and still marks this job as failed; nothing about the test result is hidden.
      - name: Build debug APK
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleDebug --stacktrace

      # Compiles the shrunk (R8) release build too, so a release never fails at publish time.
      # Not uploaded: real releases are signed by the release workflow with the Y.tube key.
      - name: Verify release build
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Y.tube-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
