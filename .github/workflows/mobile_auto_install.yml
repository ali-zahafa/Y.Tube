name: 📱 Mobile 1-Click Auto-Install & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto_integrate_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Inject SuperPlayer Modules on Cloud
        run: |
          PKG_DIR="app/src/main/java/com/ytube/player"
          mkdir -p "$PKG_DIR/engine" "$PKG_DIR/service" "$PKG_DIR/ui" "$PKG_DIR/download" "$PKG_DIR/state"

          echo "" | base64 -d > "$PKG_DIR/engine/StreamFallbackEngine.kt"
          echo "" | base64 -d > "$PKG_DIR/service/SuperPlaybackService.kt"
          echo "" | base64 -d > "$PKG_DIR/ui/SuperVideoView.kt"
          echo "" | base64 -d > "$PKG_DIR/download/SuperDownloader.kt"
          echo "" | base64 -d > "$PKG_DIR/state/SuperPlayerState.kt"

          git config user.name "GitHub Actions Auto-Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || (git commit -m "feat(auto): cloud-inject SuperPlayer modules from mobile" && git push)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready APK for Mobile Download
        uses: actions/upload-artifact@v4
        with:
          name: Y.Tube-SuperPlayer-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk
